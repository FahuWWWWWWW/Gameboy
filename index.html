                                    <h5 class="font-bold text-slate-700">3. IRAM 内存优化 (Code)</h5>
                                    <p class="text-sm text-slate-600 mt-1">
                                        将热点函数（Hot Path）放入内部SRAM执行，避免SPI Flash缓存未命中导致的卡顿。
                                    </p>
                                    <div class="mt-2 bg-slate-100 p-2 rounded font-mono text-xs text-brand-700 inline-block">
                                        void <span class="font-bold">IRAM_ATTR</span> ppu_render_line() { ... }
                                    </div>
                                </li>
                            </ol>
                        </div>

                        <!-- STM32 Content -->
                        <div id="content-stm32" class="tab-content p-8 bg-slate-50/50">
                            <h4 class="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2">
                                <span class="bg-slate-200 text-slate-700 px-2 py-1 rounded text-xs">Advanced</span>
                                基于 STM32 (F4/H7) 的移植差异
                            </h4>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                                <div class="bg-white p-4 rounded border border-slate-200">
                                    <h5 class="font-bold text-red-600 text-sm mb-2"><i class="ph-bold ph-warning"></i> 性能瓶颈</h5>
                                    <p class="text-xs text-slate-600">STM32F103 (72MHz) 无法运行NES模拟器。至少需要 <strong>STM32F407 (168MHz)</strong> 或更强型号。</p>
                                </div>
                                <div class="bg-white p-4 rounded border border-slate-200">
                                    <h5 class="font-bold text-blue-600 text-sm mb-2"><i class="ph-bold ph-arrows-left-right"></i> SPI 处理差异</h5>
                                    <p class="text-xs text-slate-600">STM32 HAL库效率较低，建议直接使用 <strong>LL库</strong> 或操作寄存器配置DMA。</p>
                                </div>
                            </div>
                            <ol class="space-y-4 text-sm text-slate-700 list-decimal list-inside">
                                <li>
                                    <strong>FatFS 集成：</strong> STM32通常没有原生的VFS支持，需要手动移植 FatFS 库并对接 SDIO 驱动。
                                </li>
                                <li>
                                    <strong>超频 (Overclocking)：</strong> 为了跑满60FPS，常需将系统时钟超频。例如F407从168MHz超至240MHz（需注意散热）。
                                </li>
                                <li>
                                    <strong>无 OS 裸机运行：</strong> STM32上通常不运行FreeRTOS以节省开销，采用简单的 <code>while(1) { emu_loop(); }</code> 结构。
                                </li>
                            </ol>
                        </div>
                    </div>

                    <!-- 避坑指南卡片 -->
                    <h3 class="text-xl font-bold text-slate-800 mb-6">⚠️ 工程实战避坑指南 (Attention Points)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- Card 1 -->
                        <div class="bg-red-50 rounded-xl p-5 border border-red-100 hover:shadow-md transition-shadow">
                            <div class="w-10 h-10 bg-red-100 text-red-600 rounded-lg flex items-center justify-center mb-3">
                                <i class="ph-fill ph-lightning text-xl"></i>
                            </div>
                            <h4 class="font-bold text-slate-800 mb-2">电源纹波干扰</h4>
                            <p class="text-xs text-slate-600 leading-relaxed">
                                <strong>现象：</strong> 屏幕有水波纹，音频有滋滋声。<br>
                                <strong>对策：</strong> 在LDO输出端并联 100uF 钽电容。PCB走线时，模拟地(AGND)与数字地(DGND)单点接地。
                            </p>
                        </div>
                        <!-- Card 2 -->
                        <div class="bg-yellow-50 rounded-xl p-5 border border-yellow-100 hover:shadow-md transition-shadow">
                            <div class="w-10 h-10 bg-yellow-100 text-yellow-600 rounded-lg flex items-center justify-center mb-3">
                                <i class="ph-fill ph-wifi-high text-xl"></i>
                            </div>
                            <h4 class="font-bold text-slate-800 mb-2">Wi-Fi / ADC 冲突</h4>
                            <p class="text-xs text-slate-600 leading-relaxed">
                                <strong>现象：</strong> 开启Wi-Fi后，按键ADC读取值乱跳。<br>
                                <strong>对策：</strong> ESP32的ADC2通道与Wi-Fi共用。必须将按键连接到 <strong>ADC1</strong> (GPIO 32-39) 引脚。
                            </p>
                        </div>
                        <!-- Card 3 -->
                        <div class="bg-blue-50 rounded-xl p-5 border border-blue-100 hover:shadow-md transition-shadow">
                            <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-lg flex items-center justify-center mb-3">
                                <i class="ph-fill ph-wave-sine text-xl"></i>
                            </div>
                            <h4 class="font-bold text-slate-800 mb-2">SPI 信号完整性</h4>
                            <p class="text-xs text-slate-600 leading-relaxed">
                                <strong>现象：</strong> 屏幕花屏或全白，SD卡读取失败。<br>
                                <strong>对策：</strong> SPI时钟线(SCK)超过40MHz时，导线长度不能超过5cm。PCB上SCK线需包地处理。
                            </p>
                        </div>
                    </div>
                `
            }
        ];

        // --- Hardware Data ---
        const pinDetails = {
            'esp': {
                title: 'ESP32-WROVER-E',
                desc: '核心大脑 (The Brain)',
                specs: ['Dual-Core 240MHz', '4MB Flash', '8MB PSRAM (必需)', 'Wi-Fi/BT 4.2'],
                reason: 'PSRAM是运行NES模拟器的硬性要求，SRAM (520KB) 不足以容纳整个PPU帧缓存和ROM数据。'
            },
            'lcd': {
                title: 'ILI9341 LCD',
                desc: '显示输出 (Visual)',
                specs: ['SPI Interface (VSPI)', 'CS: GPIO 5', 'DC: GPIO 21', 'CLK: 60MHz (Overclocked)'],
                reason: '使用VSPI硬件通道，配合DMA双缓冲技术，在SPI串行总线上实现了并口屏的刷新率。'
            },
            'audio': {
                title: 'PCM5102 DAC',
                desc: '音频输出 (Sound)',
                specs: ['I2S Interface', 'BCK: GPIO 26', 'DATA: GPIO 22', '32-bit/384kHz'],
                reason: '硬件I2S直接DMA传输，不占用CPU周期。相比PWM，提供了Hi-Fi级的信噪比，无底噪。'
            },
            'sd': {
                title: 'MicroSD Card',
                desc: '数据存储 (Storage)',
                specs: ['SPI Mode', 'CS: GPIO 13', 'Max Speed: 20MHz'],
                reason: '用于存放 .nes 游戏文件、模拟器存档以及封面图片。与屏幕共享SPI总线。'
            },
            'input': {
                title: 'Input Controls',
                desc: '交互输入 (Input)',
                specs: ['D-Pad + ABXY', 'GPIO Direct Scan', 'Software Debounce: 5ms'],
                reason: '直接GPIO扫描响应最快（<1ms）。未使用I2C扩展芯片以避免总线延迟。'
            }
        };

        // --- Helper Functions ---

        // Render Nav
        function renderNav() {
            const container = document.getElementById('nav-container');
            container.innerHTML = reportData.map((section, idx) => `
                <a href="#section-${idx}" id="nav-link-${idx}" onclick="scrollToSection(${idx}); return false;" 
                   class="flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-all hover:bg-slate-800 hover:text-white text-slate-400 group border-l-4 border-transparent">
                    <i class="${section.icon} text-lg group-hover:text-brand-500 transition-colors"></i>
                    <span>${section.title.split(' ')[1] || section.title}</span> 
                </a>
            `).join('');
        }

        // Render Content
        function renderContent() {
            const container = document.getElementById('content-area');
            container.innerHTML = reportData.map((section, idx) => `
                <section id="section-${idx}" class="scroll-mt-32 opacity-0 translate-y-8 transition-all duration-700 ease-out">
                    <div class="mb-8 border-b border-slate-200 pb-4">
                        <div class="flex items-center gap-3 mb-2">
                             <div class="w-10 h-10 rounded-full bg-brand-50 flex items-center justify-center text-brand-600 text-xl shadow-sm">
                                <i class="${section.icon}"></i>
                             </div>
                             <h2 class="text-3xl font-bold text-slate-800">${section.title}</h2>
                        </div>
                        <p class="text-slate-500 ml-14">${section.subtitle}</p>
                    </div>
                    <div class="prose prose-slate max-w-none text-slate-600">
                        ${section.content}
                    </div>
                </section>
            `).join('');
            
            // Animation Trigger
            setTimeout(() => {
                const observer = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            entry.target.classList.remove('opacity-0', 'translate-y-8');
                            entry.target.classList.add('opacity-100', 'translate-y-0');
                        }
                    });
                }, { threshold: 0.1 });
                document.querySelectorAll('section').forEach(sec => observer.observe(sec));
            }, 100);
        }

        // Deployment Tab Switcher
        window.switchDeployTab = function(platform) {
            // Reset Buttons
            document.getElementById('tab-btn-esp32').className = "flex-1 py-4 text-sm font-bold text-slate-500 hover:text-slate-700 transition-colors flex justify-center items-center gap-2 border-b-2 border-transparent bg-slate-50";
            document.getElementById('tab-btn-stm32').className = "flex-1 py-4 text-sm font-bold text-slate-500 hover:text-slate-700 transition-colors flex justify-center items-center gap-2 border-b-2 border-transparent bg-slate-50";
            
            // Activate Button
            const activeBtnClass = "flex-1 py-4 text-sm font-bold text-brand-600 border-b-2 border-brand-600 bg-white transition-colors flex justify-center items-center gap-2";
            document.getElementById(`tab-btn-${platform}`).className = activeBtnClass;

            // Content Switch
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`content-${platform}`).classList.add('active');
        };

        // Pin Map Visualizer
        window.showPinMap = function(id) {
            const data = pinDetails[id];
            const panel = document.getElementById('pin-detail-content');
            
            panel.innerHTML = `
                <div class="animate-fadeIn">
                    <div class="flex items-center justify-between mb-4">
                        <h5 class="text-lg font-bold text-brand-700">${data.title}</h5>
                        <i class="ph-fill ph-check-circle text-green-500 text-xl"></i>
                    </div>
                    <p class="text-xs text-slate-500 mb-6 italic border-l-2 border-slate-300 pl-3">${data.desc}</p>
                    
                    <div class="bg-slate-50 rounded p-4 mb-4 border border-slate-200 shadow-sm">
                        <h6 class="text-[10px] font-bold text-slate-400 mb-3 uppercase tracking-wider">Pin Configuration</h6>
                        <ul class="text-xs font-mono space-y-2 text-slate-700">
                            ${data.specs.map(s => `<li class="flex items-center gap-2"><div class="w-1.5 h-1.5 bg-brand-500 rounded-full"></div>${s}</li>`).join('')}
                        </ul>
                    </div>

                    <div class="bg-yellow-50 rounded p-4 border border-yellow-100">
                         <h6 class="text-[10px] font-bold text-yellow-600 mb-2 uppercase tracking-wider">Why this choice?</h6>
                         <p class="text-xs text-yellow-800 leading-relaxed font-medium">${data.reason}</p>
                    </div>
                </div>
            `;
        };

        // Emulator Simulation (Same logic as V2 but refined visuals)
        let emuState = 0; 
        let scanlines = 0;

        window.emuStep = function() {
            const cpu = document.getElementById('sim-cpu');
            const ppu = document.getElementById('sim-ppu');
            const dma = document.getElementById('sim-dma');
            const consoleDiv = document.getElementById('sim-console');
            
            // Helper to reset visuals
            [cpu, ppu, dma].forEach(el => {
                el.classList.remove('ring-2', 'ring-green-400', 'ring-purple-400', 'ring-blue-400', 'bg-slate-800');
                el.classList.add('opacity-50', 'bg-slate-700/80');
            });

            if (emuState === 0 || emuState === 4) {
                // CPU
                emuState = 1;
                cpu.classList.remove('opacity-50', 'bg-slate-700/80');
                cpu.classList.add('ring-2', 'ring-green-400', 'bg-slate-700');
                document.getElementById('sim-cpu-op').innerText = "LDA $2002";
                document.getElementById('sim-cpu-op').className = "h-16 flex items-center justify-center bg-slate-900 rounded font-mono text-green-400 text-xs p-2 border border-green-500/50 shadow-[0_0_10px_rgba(74,222,128,0.2)]";
                log(consoleDiv, "CPU: Fetch/Decode. Cycles += 3");
                updateCycles(3);
            } else if (emuState === 1) {
                // CPU
                emuState = 2;
                cpu.classList.remove('opacity-50', 'bg-slate-700/80');
                cpu.classList.add('ring-2', 'ring-green-400', 'bg-slate-700');
                document.getElementById('sim-cpu-op').innerText = "STA $2005";
                 document.getElementById('sim-cpu-op').className = "h-16 flex items-center justify-center bg-slate-900 rounded font-mono text-green-400 text-xs p-2 border border-green-500/50 shadow-[0_0_10px_rgba(74,222,128,0.2)]";
                log(consoleDiv, "CPU: Write Scroll Register.");
                updateCycles(2);
            } else if (emuState === 2) {
                // PPU
                emuState = 3;
                ppu.classList.remove('opacity-50', 'bg-slate-700/80');
                ppu.classList.add('ring-2', 'ring-purple-400', 'bg-slate-700');
                
                const bar = document.getElementById('sim-ppu-bar');
                bar.style.width = '100%';
                setTimeout(() => { bar.style.width = '0%'; }, 500);
                
                scanlines++;
                document.getElementById('sim-scanline').innerText = `Line: ${scanlines}/16`;
                log(consoleDiv, `PPU: Catch-up Render. Scanline ${scanlines} done.`);

                if (scanlines >= 16) {
                    emuState = 4;
                } else {
                    emuState = 0;
                }
            } else if (emuState === 3 || emuState === 4) {
                // DMA
                dma.classList.remove('opacity-50', 'bg-slate-700/80');
                dma.classList.add('ring-2', 'ring-blue-400', 'bg-slate-700');
                document.getElementById('sim-dma-status').innerText = "BUSY";
                
                const flow = document.getElementById('sim-dma-flow');
                flow.style.width = '100%';
                setTimeout(() => { 
                    flow.style.width = '0%'; 
                    document.getElementById('sim-dma-status').innerText = "IDLE";
                }, 800);

                log(consoleDiv, "<span class='text-blue-400 font-bold'>DMA: Sending Block to LCD...</span>");
                scanlines = 0;
                emuState = 0;
            }
        };

        window.emuReset = function() {
            scanlines = 0;
            document.getElementById('sim-scanline').innerText = "Line: 0/16";
            document.getElementById('sim-console').innerHTML = "<span class='text-green-500'>[SYSTEM]</span> Reset.<br>";
            emuState = 0;
        };

        function log(container, msg) {
            container.innerHTML += `> ${msg}<br>`;
            container.scrollTop = container.scrollHeight;
        }

        function updateCycles(num) {
            const el = document.getElementById('sim-cpu-cycles');
            let current = parseInt(el.innerText.split(': ')[1]);
            el.innerText = `Cycles: ${current + num}`;
        }

        // --- Navigation Logic ---
        window.scrollToSection = function(idx) {
            const el = document.getElementById(`section-${idx}`);
            const offset = 120; // sticky header height
            const bodyRect = document.body.getBoundingClientRect().top;
            const elementRect = el.getBoundingClientRect().top;
            const elementPosition = elementRect - bodyRect;
            const offsetPosition = elementPosition - offset;

            document.getElementById('main-scroll').scrollTo({
                top: document.getElementById('main-scroll').scrollTop + el.getBoundingClientRect().top - 120,
                behavior: 'smooth'
            });
            
            // Mobile close
            if(window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
            }
        };

        // Active Link Highlighter using IntersectionObserver
        function setupActiveSpy() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        // Get ID
                        const id = entry.target.id.split('-')[1];
                        // Remove active class from all
                        document.querySelectorAll('#nav-container a').forEach(a => {
                            a.classList.remove('nav-active', 'border-brand-500', 'bg-slate-800', 'text-white');
                            a.classList.add('border-transparent', 'text-slate-400');
                        });
                        // Add active to current
                        const activeLink = document.getElementById(`nav-link-${id}`);
                        if (activeLink) {
                            activeLink.classList.remove('border-transparent', 'text-slate-400');
                            activeLink.classList.add('nav-active', 'border-brand-500');
                        }
                        
                        // Update Header Title dynamically
                        const titleText = reportData[id].title;
                        document.getElementById('header-title').innerText = titleText;
                    }
                });
            }, {
                root: document.getElementById('main-scroll'),
                threshold: 0.2, // Trigger when 20% visible
                rootMargin: "-10% 0px -70% 0px" // Focus area in the middle-top
            });

            document.querySelectorAll('section').forEach(sec => observer.observe(sec));
        }

        // --- Init ---
        document.addEventListener('DOMContentLoaded', () => {
            renderNav();
            renderContent();
            
            // Setup Listeners
            document.getElementById('menu-toggle').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('-translate-x-full');
            });

            const mainScroll = document.getElementById('main-scroll');
            mainScroll.addEventListener('scroll', () => {
                const total = mainScroll.scrollHeight - mainScroll.clientHeight;
                const prog = (mainScroll.scrollTop / total) * 100;
                document.getElementById('read-progress').style.width = `${prog}%`;
            });

            // Delay observer setup slightly to ensure content render
            setTimeout(setupActiveSpy, 500);
        });

    </script>
</body>
</html>
